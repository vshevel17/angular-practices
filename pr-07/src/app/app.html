<h2>RxJS: Ланцюжок асинхронних запитів</h2>

<h3>Користувачі</h3>
<ul>
  <li *ngFor="let user of users$ | async">
    <button (click)="selectUser(user.id)">
      {{ user.name }}
    </button>
  </li>
</ul>

<h3>Пости обраного користувача</h3>
<ul>
  <li *ngFor="let post of posts$ | async">
    <strong>{{ post.title }}</strong>
    <p>{{ post.body }}</p>
  </li>
</ul>
