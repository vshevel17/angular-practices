<h2>Configurable Highlight Directive</h2>

<p configurableHighlight [highlightColor]="'cyan'">
  Наведи мишу — підсвітиться cyan
</p>

<div configurableHighlight [highlightColor]="'lightgreen'" style="padding: 12px; border: 1px solid #ccc;">
  Наведи мишу — підсвітиться lightgreen
</div>

<p configurableHighlight>
  Тут колір за замовчуванням (yellow)
</p>
